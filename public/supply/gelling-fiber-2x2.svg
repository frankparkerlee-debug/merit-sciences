<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Gelling Fiber">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F1EA"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F7F8FA"/>
      <stop offset="0.55" stop-color="#EDEFF3"/>
      <stop offset="1" stop-color="#F7F8FA"/>
    </linearGradient>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <!-- pouch body -->
  <g>
    <rect x="128" y="96" width="384" height="448" rx="10" fill="url(#foil)" stroke="#E2E5EB" stroke-width="2"/>
    <!-- sealed top crimp -->
    <rect x="128" y="96" width="384" height="34" rx="10" fill="#E9ECF1"/>
    <g stroke="#94A0B0" stroke-width="1" opacity="0.45">
      <line x1="140" y1="102" x2="140" y2="124"/><line x1="156" y1="102" x2="156" y2="124"/><line x1="172" y1="102" x2="172" y2="124"/><line x1="188" y1="102" x2="188" y2="124"/><line x1="204" y1="102" x2="204" y2="124"/><line x1="220" y1="102" x2="220" y2="124"/><line x1="236" y1="102" x2="236" y2="124"/><line x1="252" y1="102" x2="252" y2="124"/><line x1="268" y1="102" x2="268" y2="124"/><line x1="284" y1="102" x2="284" y2="124"/><line x1="300" y1="102" x2="300" y2="124"/><line x1="316" y1="102" x2="316" y2="124"/><line x1="332" y1="102" x2="332" y2="124"/><line x1="348" y1="102" x2="348" y2="124"/><line x1="364" y1="102" x2="364" y2="124"/><line x1="380" y1="102" x2="380" y2="124"/><line x1="396" y1="102" x2="396" y2="124"/><line x1="412" y1="102" x2="412" y2="124"/><line x1="428" y1="102" x2="428" y2="124"/><line x1="444" y1="102" x2="444" y2="124"/><line x1="460" y1="102" x2="460" y2="124"/><line x1="476" y1="102" x2="476" y2="124"/><line x1="492" y1="102" x2="492" y2="124"/><line x1="508" y1="102" x2="508" y2="124"/>
    </g>
    <!-- accent spine -->
    <rect x="128" y="150" width="8" height="394" fill="#0E7C86"/>
  </g>

  <!-- wordmark -->
  <text x="168" y="196" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="800" fill="#0B0F19" letter-spacing="-0.5">Merit<tspan fill="#0E7C86">.</tspan></text>
  <text x="168" y="216" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#94A0B0" letter-spacing="3">CLINICAL</text>

  <!-- product name -->
  <text x="168" y="288" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#0B0F19" letter-spacing="-0.7">Gelling Fiber</text>
  <text x="168" y="316" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#4A5160">Carboxymethylcellulose gelling fiber</text>

  <!-- size, the thing a buyer scans for -->
  <text x="168" y="392" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#0E7C86" letter-spacing="-1.5">2" × 2"</text>

  <!-- spec rail -->
  <line x1="168" y1="424" x2="472" y2="424" stroke="#E2E5EB" stroke-width="2"/>
  <text x="168" y="454" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#4A5160">HCPCS A6196</text>
  <text x="168" y="480" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#4A5160" letter-spacing="1.5">STERILE · SINGLE USE</text>

  <text x="168" y="516" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A0B0">Supplied to licensed clinicians and healthcare facilities</text>
</svg>
