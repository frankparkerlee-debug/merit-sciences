<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Skin Barrier Film">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F1EA"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#F7F8FA"/>
      <stop offset="0.55" stop-color="#EDEFF3"/>
      <stop offset="1" stop-color="#F7F8FA"/>
    </linearGradient>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>

  <g>
    <rect x="128" y="96" width="384" height="448" rx="6" fill="url(#foil)" stroke="#E2E5EB" stroke-width="2"/>
    <line x1="128" y1="150" x2="512" y2="150" stroke="#E2E5EB" stroke-width="2"/>
    <rect x="128" y="150" width="8" height="394" fill="#0E7C86"/>
  </g>

  <!-- wordmark -->
  <text x="168" y="196" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="800" fill="#0B0F19" letter-spacing="-0.5">Merit<tspan fill="#0E7C86">.</tspan></text>
  <text x="168" y="216" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#94A0B0" letter-spacing="3">CLINICAL</text>

  <!-- product name -->
  <text x="168" y="288" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#0B0F19" letter-spacing="-0.7">Skin Barrier Film</text>
  <text x="168" y="316" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="500" fill="#4A5160">No-sting barrier film wipes to protect periwound skin from adhesive trauma and moisture</text>

  <!-- size, the thing a buyer scans for -->
  <text x="168" y="392" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#0E7C86" letter-spacing="-1.5">Wipes, 30 ct</text>

  <!-- spec rail -->
  <line x1="168" y1="424" x2="472" y2="424" stroke="#E2E5EB" stroke-width="2"/>
  <text x="168" y="454" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#4A5160">HCPCS A6250</text>
  

  <text x="168" y="516" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A0B0">Supplied to licensed clinicians and healthcare facilities</text>
</svg>
