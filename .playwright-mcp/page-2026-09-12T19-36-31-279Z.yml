        - generic [ref=f3e45]:
          - heading "What is Tirzepatide?" [level=2] [ref=f3e46]
          - generic [ref=f3e47]:
            - paragraph [ref=f3e48]: Tirzepatide (research code LY3298176) is a synthetic 39-amino-acid peptide engineered to act as a single-molecule dual agonist at the glucose-dependent insulinotropic polypeptide (GIP) receptor and the glucagon-like peptide-1 (GLP-1) receptor. The molecule incorporates a C20 fatty-acid moiety that supports extended duration of action via albumin binding.
            - paragraph [ref=f3e49]: Tirzepatide is a regulated therapeutic compound approved for human use under separate brand names in regulated channels. The Merit Sciences offering is supplied for research use only — not for human or veterinary administration. Researchers must confirm jurisdictional eligibility before procurement.
        - generic [ref=f3e50]:
          - heading "How does Tirzepatide work?" [level=2] [ref=f3e51]
          - paragraph [ref=f3e53]: Binds and activates both the GIP receptor and the GLP-1 receptor with picomolar affinity. The dual-incretin pharmacology is reported to produce additive effects on insulin secretion and glucagon suppression in preclinical metabolic research models.
        - generic [ref=f3e54]:
          - heading "What the research shows" [level=2] [ref=f3e55]
          - list [ref=f3e57]:
            - listitem [ref=f3e58]: In SURMOUNT-1 (NEJM 2022), a 72-week randomized trial in 2,539 adults with obesity, participants in the highest-dose arm saw a mean body-weight reduction of roughly 20.9% from baseline versus about 3.1% on placebo — the largest effect reported for an incretin agent at the time of publication.
            - listitem [ref=f3e60]: In SURPASS-2 (NEJM 2021), tirzepatide was compared head-to-head against semaglutide 1 mg in type-2-diabetes research; all three tirzepatide doses produced greater reductions in HbA1c and body weight than semaglutide in the study population.
            - listitem [ref=f3e62]: The dual mechanism — simultaneous agonism at the GIP and GLP-1 receptors — is the design feature most cited in the literature as the basis for its effect size relative to single-incretin GLP-1 agonists.
            - listitem [ref=f3e64]: Gastrointestinal effects (nausea, diarrhea) were the most frequently reported adverse events across the trial program, generally mild-to-moderate and most common during dose escalation.
