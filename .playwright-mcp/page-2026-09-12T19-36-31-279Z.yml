        - generic [ref=f3e103]:
          - heading "Frequently asked questions" [level=2] [ref=f3e104]
          - generic [ref=f3e106]:
            - generic [ref=f3e107]:
              - heading "What is tirzepatide?" [level=3] [ref=f3e108]
              - paragraph [ref=f3e109]: Tirzepatide (research code LY3298176) is a synthetic dual agonist that activates both the GIP and GLP-1 receptors. It is the compound studied in the SURMOUNT (obesity) and SURPASS (type-2-diabetes) clinical-trial programs. Merit supplies it as a lyophilized research compound for research use only — not for human or veterinary use.
            - generic [ref=f3e110]:
              - heading "How does tirzepatide work?" [level=3] [ref=f3e111]
              - paragraph [ref=f3e112]: It is a "dual incretin" — a single peptide engineered to activate two gut-hormone receptors at once (GIP and GLP-1). Published trials attribute its effect size relative to single-receptor GLP-1 agonists to this combined mechanism. Mechanistic descriptions here summarize published findings and are not clinical claims.
            - generic [ref=f3e113]:
              - heading "What did the tirzepatide trials show?" [level=3] [ref=f3e114]
              - paragraph [ref=f3e115]: In SURMOUNT-1, the highest-dose arm showed a mean body-weight reduction of about 20.9% over 72 weeks versus ~3.1% on placebo. In SURPASS-2, it produced greater HbA1c and weight reductions than semaglutide 1 mg. See the linked SURMOUNT-1 and SURPASS-2 summaries for trial design and full outcomes.
            - generic [ref=f3e116]:
              - heading "Is Merit tirzepatide for human use?" [level=3] [ref=f3e117]
              - paragraph [ref=f3e118]: No. It is sold strictly for research use only — not for human or veterinary use, and not for diagnostic or therapeutic use. Every lot ships with a certificate of analysis documenting ≥99% HPLC purity.
