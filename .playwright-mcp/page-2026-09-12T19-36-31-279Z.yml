            - definition [ref=f3e41]: Developed by Eli Lilly. First characterized in the open scientific literature in 2018 (Coskun et al.). Approved by the FDA as Mounjaro (2022) for type 2 diabetes and as Zepbound (2023) for chronic weight management.
