          - paragraph [ref=e197]: — Mechanism
          - heading "How it's been studied." [level=2] [ref=e198]
        - generic [ref=e199]:
          - paragraph [ref=e200]: BPC-157 has been investigated in preclinical models for effects on angiogenesis (VEGF/VEGFR2 axis modulation), nitric oxide system regulation, growth hormone receptor expression, and dopaminergic / serotonergic system interactions. TB-500 functions primarily as an actin-sequestering protein involved in cell motility, organogenesis, and the regulation of actin polymerization in research models. Both peptides remain under active investigation; mechanisms described above reflect preclinical findings, not clinical conclusions.
          - paragraph [ref=e201]: Mechanism descriptions reflect findings reported in the preclinical and basic-research literature. They are not clinical conclusions and not statements of therapeutic effect.
